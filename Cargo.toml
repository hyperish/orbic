[workspace]
members = [
    "apps/orbic-cli",
    "crates/orbic",
    "crates/orbic-adapter-http",
    "crates/orbic-adapter-serge",
    "crates/orbic-auth",
    "crates/orbic-cache",
    "crates/orbic-core",
    "crates/orbic-db",
    "crates/orbic-jobs",
    "crates/orbic-macros",
    "crates/orbic-msa",
    "crates/orbic-notify",
    "crates/orbic-openapi",
    "crates/orbic-realtime",
    "crates/orbic-sql-cache",
    "crates/orbic-storage",
    "crates/orbic-tests",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/hyperish/orbic"
authors = ["Hyperish Contributors"]

[workspace.dependencies]
# Internal crates.
orbic = { path = "crates/orbic", version = "=0.1.0-alpha.1", default-features = false }
orbic-adapter-serge = { path = "crates/orbic-adapter-serge", version = "=0.1.0-alpha.1" }
serge-web-ssr = { path = "../serge/crates/serge-web-ssr", version = "=0.1.0-alpha.1" }
orbic-adapter-http = { path = "crates/orbic-adapter-http", version = "=0.1.0-alpha.1" }
orbic-auth = { path = "crates/orbic-auth", version = "=0.1.0-alpha.1" }
orbic-cache = { path = "crates/orbic-cache", version = "=0.1.0-alpha.1" }
orbic-core = { path = "crates/orbic-core", version = "=0.1.0-alpha.1" }
orbic-db = { path = "crates/orbic-db", version = "=0.1.0-alpha.1" }
orbic-jobs = { path = "crates/orbic-jobs", version = "=0.1.0-alpha.1" }
orbic-openapi = { path = "crates/orbic-openapi", version = "=0.1.0-alpha.1" }
orbic-realtime = { path = "crates/orbic-realtime", version = "=0.1.0-alpha.1" }
orbic-macros = { path = "crates/orbic-macros", version = "=0.1.0-alpha.1" }
orbic-msa = { path = "crates/orbic-msa", version = "=0.1.0-alpha.1" }
orbic-notify = { path = "crates/orbic-notify", version = "=0.1.0-alpha.1" }
orbic-sql-cache = { path = "crates/orbic-sql-cache", version = "=0.1.0-alpha.1" }
orbic-storage = { path = "crates/orbic-storage", version = "=0.1.0-alpha.1" }

# hyve, unpublished: sibling path plus the exact prerelease version
# (hyperish/docs 05-development-rules.md §5). Publishing keeps only the version.
hyve = { path = "../hyve/crates/hyve", version = "=0.1.0-alpha.1" }
hyve-config = { path = "../hyve/crates/hyve-config", version = "=0.1.0-alpha.1" }
hyve-diagnostics = { path = "../hyve/crates/hyve-diagnostics", version = "=0.1.0-alpha.1" }
hyve-parser = { path = "../hyve/crates/hyve-parser", version = "=0.1.0-alpha.1" }
hyve-api = { path = "../hyve/crates/hyve-api", version = "=0.1.0-alpha.1" }
hyve-core = { path = "../hyve/crates/hyve-core", version = "=0.1.0-alpha.1" }
hyve-serde = { path = "../hyve/crates/hyve-serde", version = "=0.1.0-alpha.1" }
hyve-trace = { path = "../hyve/crates/hyve-trace", version = "=0.1.0-alpha.1" }
hyve-validate = { path = "../hyve/crates/hyve-validate", version = "=0.1.0-alpha.1" }

# External dependencies, not forked (docs/02-architecture.md §3).
matchit = "0.9.2"
# Pinned instead of forked (docs/02 §3 실행 기록).
quick_cache = "=0.7.0"
fred = { version = "=10.1.0", default-features = false, features = ["i-keys", "i-hashes", "i-scripts", "i-pubsub", "enable-rustls-ring"] }
sqlx = { version = "=0.9.1", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "sqlite-unlock-notify", "postgres"] }
tokio = "1.54.1"
tokio-util = "0.7"
# HTTP adapter (hyper pinned, not forked; docs/02-architecture.md §3).
bytes = "=1.12.2"
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false }
hyper-util = { version = "=0.1.21", default-features = false }
# OpenAPI model only; its `macros` feature is needed for the model to compile
# (upstream gates an internal path behind it), the derives are never used
# (docs/02-architecture.md §3).
utoipa = { version = "=6.0.0", default-features = false, features = ["macros"] }
# Already in the tree through sqlx-postgres; same versions.
getrandom = "=0.4.3"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
rust-s3 = { version = "=0.38.0", default-features = false, features = ["tokio-rustls-tls-ring", "fail-on-err"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots", "stream", "http2"] }
lettre = { version = "=0.11.24", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls", "ring", "rustls-native-certs"] }
base64 = "=0.22.1"
ring = "=0.17.14"
serde_json = "=1.0.154"
futures-util = "=0.3.34"
wtransport = { version = "=0.7.2", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
cron = "=0.17.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full"] }
trybuild = "1.0.119"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
