[workspace]
members = [
    "crates/orbic",
    "crates/orbic-cache",
    "crates/orbic-core",
    "crates/orbic-db",
    "crates/orbic-macros",
    "crates/orbic-sql-cache",
    "crates/orbic-tests",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/hyperish/orbic"
authors = ["Hyperish Contributors"]

[workspace.dependencies]
# Internal crates.
orbic = { path = "crates/orbic", version = "=0.1.0-alpha.0", default-features = false }
orbic-cache = { path = "crates/orbic-cache", version = "=0.1.0-alpha.0" }
orbic-core = { path = "crates/orbic-core", version = "=0.1.0-alpha.0" }
orbic-db = { path = "crates/orbic-db", version = "=0.1.0-alpha.0" }
orbic-macros = { path = "crates/orbic-macros", version = "=0.1.0-alpha.0" }
orbic-sql-cache = { path = "crates/orbic-sql-cache", version = "=0.1.0-alpha.0" }

# hyve, unpublished: sibling path plus the exact prerelease version
# (hyperish/docs 05-development-rules.md §5). Publishing keeps only the version.
hyve = { path = "../hyve/crates/hyve", version = "=0.1.0-alpha.0" }
hyve-diagnostics = { path = "../hyve/crates/hyve-diagnostics", version = "=0.1.0-alpha.0" }
hyve-parser = { path = "../hyve/crates/hyve-parser", version = "=0.1.0-alpha.0" }
hyve-api = { path = "../hyve/crates/hyve-api", version = "=0.1.0-alpha.0" }
hyve-core = { path = "../hyve/crates/hyve-core", version = "=0.1.0-alpha.0" }
hyve-serde = { path = "../hyve/crates/hyve-serde", version = "=0.1.0-alpha.0" }
hyve-validate = { path = "../hyve/crates/hyve-validate", version = "=0.1.0-alpha.0" }

# External dependencies, not forked (docs/02-architecture.md §3).
matchit = "0.9.2"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full"] }
trybuild = "1.0.119"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
