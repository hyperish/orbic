name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Must match `rust-version` in Cargo.toml (hyperish/docs 05-development-rules.md §8).
  MSRV: "1.94"
  # hyve is not published yet: the workspace depends on `../hyve` with an exact
  # version (hyperish/docs 05-development-rules.md §5), so CI checks it out next
  # to orbic. Switch to the registry once `hyve 0.1.0-alpha.N` is published.
  HYVE_REF: feat/phase1
  # PostgreSQL tests and `hyve-orbic codegen --check` need a server; without
  # it they fail rather than skip (docs/01-dx-and-dsl.md §4).
  HYPERISH_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

jobs:
  check:
    name: Format, Clippy & Test (stable)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: orbic
    steps:
      - uses: actions/checkout@v4
        with:
          path: orbic
      - uses: actions/checkout@v4
        with:
          repository: hyperish/hyve
          ref: ${{ env.HYVE_REF }}
          path: hyve
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: orbic
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      # The fixture crate plays an app's shared crate; `#[server]` handler
      # bodies exist only with its `server` feature, so test both builds.
      - name: Lint and test with the server feature
        run: |
          cargo clippy -p orbic-tests --all-targets --features server --locked -- -D warnings
          cargo test -p orbic-tests --features server --locked
      # Client builds of shared crates link only the macros (docs/01 §1).
      - name: Check the client build on wasm32
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p orbic-tests --target wasm32-unknown-unknown --locked

  msrv:
    name: Build on the declared minimum Rust version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orbic
    steps:
      - uses: actions/checkout@v4
        with:
          path: orbic
      - uses: actions/checkout@v4
        with:
          repository: hyperish/hyve
          ref: ${{ env.HYVE_REF }}
          path: hyve
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: orbic
      - name: Check
        run: cargo check --workspace --all-targets --locked
