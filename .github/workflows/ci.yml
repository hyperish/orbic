name: CI

on:
  workflow_call:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

env:
  # Use the sibling revisions exercised together in platform acceptance.
  HYVE_REF: ab3b833cdf5bfd5ea32d5f20b92fc198447d70d8
  SERGE_REF: 1c6d1e2cba14acb2db8b675afadd5c2c9a404dad
  CARGO_TERM_COLOR: always
  # Must match `rust-version` in Cargo.toml (hyperish/docs 05-development-rules.md §8).
  MSRV: "1.94"
  # PostgreSQL tests and `hyve-orbic codegen --check` need a server; without
  # it they fail rather than skip (docs/01-dx-and-dsl.md §4).
  HYPERISH_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

jobs:
  check:
    name: Format, Clippy & Test (stable)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: orbic
    steps:
      - uses: actions/checkout@v4
        with:
          path: orbic
      - uses: actions/checkout@v4
        with:
          repository: hyperish/hyve
          ref: ${{ env.HYVE_REF }}
          path: hyve
      - uses: actions/checkout@v4
        with:
          repository: hyperish/serge
          ref: ${{ env.SERGE_REF }}
          path: serge
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: orbic
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Verify streaming SSR and atomic bundle replacement
        run: cargo test --locked -p orbic --features serge --test site
      - name: Verify registered timers in a running server
        run: cargo test --locked -p orbic --features jobs --test schedules
      - name: Verify service RPC, outbox transactions and signed webhook delivery
        run: cargo test --locked -p orbic --features msa,notify --test msa --test webhooks
      - name: Verify shared state across Valkey clients
        run: bash scripts/test-cache.sh
      - name: Verify resumable uploads against a local object store
        run: bash scripts/test-storage-s3.sh
      # The fixture crate plays an app's shared crate; `#[server]` handler
      # bodies exist only with its `server` feature, so test both builds.
      - name: Lint and test with the server feature
        run: |
          cargo clippy -p orbic-tests --all-targets --features server --locked -- -D warnings
          cargo test -p orbic-tests --features server --locked
      # Client builds of shared crates link only the macros (docs/01 §1).
      - name: Check the client build on wasm32
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p orbic-tests --target wasm32-unknown-unknown --locked
      # Every public crate packages and builds from its package alone
      # (docs/05-implementation-plan.md §3, CI). A hyve version that is not
      # on crates.io yet comes from the sibling checkout, as a patch
      # (hyperish/docs 05-development-rules.md §5); not `--locked`, since
      # the patch entries a package does not use are written to Cargo.lock.
      - name: Package the public crates
        run: |
          cargo metadata --manifest-path ../hyve/Cargo.toml --no-deps --format-version 1 \
            | jq -r '"[patch.crates-io]", (.packages[] | select(.publish == null) | "\(.name) = { path = \"\(.manifest_path | rtrimstr("/Cargo.toml"))\" }")' \
            > "$RUNNER_TEMP/siblings.toml"
          cargo metadata --manifest-path ../serge/Cargo.toml --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "serge-web-ssr" or .name == "serge-router" or .name == "serge-core" or .name == "serge-style") | "\(.name) = { path = \"\(.manifest_path | rtrimstr("/Cargo.toml"))\" }"' \
            >> "$RUNNER_TEMP/siblings.toml"
          cargo package --workspace --exclude orbic-tests --config "$RUNNER_TEMP/siblings.toml"

  msrv:
    name: Build on the declared minimum Rust version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orbic
    steps:
      - uses: actions/checkout@v4
        with:
          path: orbic
      - uses: actions/checkout@v4
        with:
          repository: hyperish/hyve
          ref: ${{ env.HYVE_REF }}
          path: hyve
      - uses: actions/checkout@v4
        with:
          repository: hyperish/serge
          ref: ${{ env.SERGE_REF }}
          path: serge
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: orbic
      - name: Check
        run: cargo check --workspace --all-targets --locked
