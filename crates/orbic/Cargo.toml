[package]
name = "orbic"
description = "Component-based Rust backend framework for the Hyperish family"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["hyperish", "backend", "web", "framework", "api"]
categories = ["web-programming::http-server", "asynchronous"]

[features]
default = ["server"]
## The runtime (pipeline, database, cache). Shared crates depend on orbic
## without default features and enable this from their own `server` feature,
## so client builds (wasm32 included) link only the macros.
server = [
    "dep:bytes",
    "dep:http",
    "dep:orbic-adapter-http",
    "dep:orbic-auth",
    "dep:orbic-cache",
    "dep:orbic-core",
    "dep:orbic-db",
    "dep:orbic-openapi",
    "dep:tokio",
]

[dependencies]
bytes = { workspace = true, optional = true }
http = { workspace = true, optional = true }
hyve.workspace = true
orbic-adapter-http = { workspace = true, optional = true }
orbic-auth = { workspace = true, optional = true }
orbic-cache = { workspace = true, optional = true }
orbic-core = { workspace = true, optional = true }
orbic-db = { workspace = true, optional = true }
orbic-macros.workspace = true
orbic-openapi = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "net"] }

[lints]
workspace = true
